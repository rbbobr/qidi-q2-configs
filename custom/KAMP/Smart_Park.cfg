[gcode_macro SMART_PARK]
description: Park at the validated purge start for final heating.
gcode:
    _KAMP_PREPARE_PURGE
    _KAMP_SMART_PARK

[gcode_macro _KAMP_SMART_PARK]
gcode:
    {% if 'xyz' not in printer.toolhead.homed_axes %}
        {action_raise_error('SMART_PARK requires XYZ homing.')}
    {% endif %}
    {% set path = printer['gcode_macro _KAMP_Purge_Path'] %}
    {% set height = printer['gcode_macro _KAMP_Settings'].smart_park_height|float %}
    {% set lift = [height - printer.gcode_move.gcode_position.z, 0.0]|max %}
    {% set z_max = [printer.toolhead.axis_maximum.z|float, printer['gcode_macro PRINTER_PARAM'].max_z_position|float]|min %}
    {% if lift > z_max - printer.toolhead.position.z %}
        {action_raise_error('SMART_PARK: insufficient Z travel for park height.')}
    {% endif %}
    SAVE_GCODE_STATE NAME=Presmartpark_State
    SAFE_Z_LIFT Z={lift}
    G90
    G0 X{path.start_x} Y{path.start_y} F{printer.toolhead.max_velocity * 60}
    RESTORE_GCODE_STATE NAME=Presmartpark_State
