# Session-only adaptive mesh reuse. Never save this cache with SAVE_CONFIG.
[gcode_macro _QIDI_MESH_CACHE]
variable_enabled: 1
variable_valid: 0
variable_tolerance: 0.03
variable_bed_tolerance: 2.0
variable_chamber_tolerance: 3.0
variable_nozzle_tolerance: 5.0
variable_max_age: 14400.0
variable_bounds: []
variable_matrix: []
variable_baseline: []
variable_samples: []
variable_temperatures: []
variable_created: 0.0
variable_result: 'none'
variable_reuses: 0
variable_calibrations: 0
gcode:

[gcode_macro QIDI_MESH_INVALIDATE]
description: Invalidate cached mesh after plate removal, surface changes or maintenance.
gcode:
    SET_GCODE_VARIABLE MACRO=_QIDI_MESH_CACHE VARIABLE=valid VALUE=0
    M118 Q2 mesh cache invalidated - next start will calibrate a new mesh.

[gcode_macro QIDI_MESH_PREPARE]
description: Verify cached mesh at five points, or calibrate a new adaptive mesh. FORCE=1 bypasses reuse.
gcode:
    {% if 'xyz' not in printer.toolhead.homed_axes or not printer.z_tilt.applied %}
        {action_raise_error('Q2 mesh: home XYZ and run Z_TILT_ADJUST first.')}
    {% endif %}
    {% set origin = printer.gcode_move.homing_origin %}
    {% if origin.x|abs > 0.00001 or origin.y|abs > 0.00001 or origin.z|abs > 0.00001 %}
        {action_raise_error('Q2 mesh: clear XYZ G-code offsets before probing; restore print Z-offset afterwards.')}
    {% endif %}
    {% if printer.extruder.temperature > 160 %}
        {action_raise_error('Q2 mesh: clean and cool nozzle to probing temperature (normally 140 C).')}
    {% endif %}
    SAVE_GCODE_STATE NAME=Q2_Mesh_State
    BED_MESH_CLEAR
    _PREP_MOTION_BEGIN
    _QIDI_MESH_SELECT FORCE={params.FORCE|default(0)|int}
    RESTORE_GCODE_STATE NAME=Q2_Mesh_State
    {% if not printer['gcode_macro _PREP_MOTION'].active|int %}
        _PREP_MOTION_END
    {% endif %}

[gcode_macro _QIDI_MESH_SELECT]
gcode:
    {% set c = printer['gcode_macro _QIDI_MESH_CACHE'] %}
    {% set bed = printer.heater_bed %}
    {% set chamber = printer['heater_generic chamber'] %}
    {% set objects = printer.exclude_object.objects|map(attribute='polygon')|sum(start=[]) %}
    {% set profile = printer.bed_mesh.profiles.q2_cached|default({}) %}
    {% set ns = namespace(reason='') %}
    {% if params.FORCE|int %}
        {% set ns.reason = 'forced' %}
    {% elif not c.enabled|int or not c.valid|int %}
        {% set ns.reason = 'empty, disabled or invalidated cache' %}
    {% elif not objects or c.bounds|length != 4 or c.baseline|length != 5 or c.temperatures|length != 5 %}
        {% set ns.reason = 'missing cache metadata or object polygons' %}
    {% elif not profile or profile.points != c.matrix %}
        {% set ns.reason = 'cached profile missing or changed' %}
    {% else %}
        {% set p = profile.mesh_params %}
        {% set margin = printer['gcode_macro _KAMP_Settings'].mesh_margin|float %}
        {% set bed_min = printer.configfile.settings.bed_mesh.mesh_min %}
        {% set bed_max = printer.configfile.settings.bed_mesh.mesh_max %}
        {% set x0 = objects|map(attribute=0)|min %}
        {% set x1 = objects|map(attribute=0)|max %}
        {% set y0 = objects|map(attribute=1)|min %}
        {% set y1 = objects|map(attribute=1)|max %}
        {% set age = printer.toolhead.estimated_print_time - c.created %}
        {% if [p.min_x,p.min_y,p.max_x,p.max_y] != c.bounds %}
            {% set ns.reason = 'cached mesh bounds changed' %}
        {% elif x0 < c.bounds[0] or y0 < c.bounds[1] or x1 > c.bounds[2] or y1 > c.bounds[3]
              or [x0-margin,bed_min[0]]|max < c.bounds[0] or [y0-margin,bed_min[1]]|max < c.bounds[1]
              or [x1+margin,bed_max[0]]|min > c.bounds[2] or [y1+margin,bed_max[1]]|min > c.bounds[3] %}
            {% set ns.reason = 'print area plus mesh margin not covered' %}
        {% elif age < 0 or age > c.max_age %}
            {% set ns.reason = 'cache expired' %}
        {% elif (bed.target-c.temperatures[0])|abs > 0.1 or (chamber.target-c.temperatures[1])|abs > 0.1
              or (bed.temperature-c.temperatures[2])|abs > c.bed_tolerance
              or (chamber.temperature-c.temperatures[3])|abs > c.chamber_tolerance
              or (printer.extruder.temperature-c.temperatures[4])|abs > c.nozzle_tolerance
              or (bed.target > 0 and (bed.temperature-bed.target)|abs > c.bed_tolerance)
              or (chamber.target > 0 and (chamber.temperature-chamber.target)|abs > c.chamber_tolerance) %}
            {% set ns.reason = 'temperature conditions changed' %}
        {% endif %}
    {% endif %}
    {% if ns.reason %}
        M118 Q2 mesh: new calibration ({ns.reason}).
        _QIDI_MESH_NEW
    {% else %}
        # Failed/aborted verification cannot leave a cache marked valid.
        SET_GCODE_VARIABLE MACRO=_QIDI_MESH_CACHE VARIABLE=valid VALUE=0
        SET_GCODE_VARIABLE MACRO=_QIDI_MESH_CACHE VARIABLE=samples VALUE=[]
        M118 Q2 mesh: checking four corners and centre.
        _QIDI_MESH_POINTS
        _QIDI_MESH_DECIDE
    {% endif %}

[gcode_macro _QIDI_MESH_NEW]
gcode:
    SET_GCODE_VARIABLE MACRO=_QIDI_MESH_CACHE VARIABLE=valid VALUE=0
    BED_MESH_CLEAR
    BED_MESH_CALIBRATE PROFILE=q2_cached
    _QIDI_MESH_CAPTURE

[gcode_macro _QIDI_MESH_CAPTURE]
gcode:
    {% set mesh = printer.bed_mesh %}
    {% set b = [mesh.mesh_min[0],mesh.mesh_min[1],mesh.mesh_max[0],mesh.mesh_max[1]] %}
    {% if mesh.profile_name != 'q2_cached' or b[2] <= b[0] or b[3] <= b[1] %}
        {action_raise_error('Q2 mesh: calibration did not produce the expected profile.')}
    {% endif %}
    {% set bed = printer.heater_bed %}
    {% set chamber = printer['heater_generic chamber'] %}
    SET_GCODE_VARIABLE MACRO=_QIDI_MESH_CACHE VARIABLE=bounds VALUE="{b}"
    SET_GCODE_VARIABLE MACRO=_QIDI_MESH_CACHE VARIABLE=matrix VALUE="{mesh.probed_matrix}"
    SET_GCODE_VARIABLE MACRO=_QIDI_MESH_CACHE VARIABLE=temperatures VALUE="{[bed.target,chamber.target,bed.temperature,chamber.temperature,printer.extruder.temperature]}"
    SET_GCODE_VARIABLE MACRO=_QIDI_MESH_CACHE VARIABLE=samples VALUE=[]
    SET_GCODE_VARIABLE MACRO=_QIDI_MESH_CACHE VARIABLE=calibrations VALUE={printer['gcode_macro _QIDI_MESH_CACHE'].calibrations|int+1}
    # All control measurements must be made with compensation disabled.
    BED_MESH_CLEAR
    _QIDI_MESH_POINTS
    _QIDI_MESH_COMMIT

[gcode_macro _QIDI_MESH_POINTS]
gcode:
    {% set b = printer['gcode_macro _QIDI_MESH_CACHE'].bounds %}
    {% if b|length != 4 or b[0] < printer.toolhead.axis_minimum.x or b[1] < printer.toolhead.axis_minimum.y
          or b[2] > printer.toolhead.axis_maximum.x or b[3] > printer.toolhead.axis_maximum.y %}
        {action_raise_error('Q2 mesh: invalid control point bounds.')}
    {% endif %}
    {% if printer.bed_mesh.profile_name %}
        {action_raise_error('Q2 mesh: disable mesh compensation before control probes.')}
    {% endif %}
    G90
    {% for point in [[b[0],b[1]],[b[2],b[1]],[b[2],b[3]],[b[0],b[3]],[(b[0]+b[2])/2,(b[1]+b[3])/2]] %}
        _QIDI_MESH_LIFT
        G0 X{point[0]} Y{point[1]} F6000
        PROBE SAMPLES=2
        _QIDI_MESH_RECORD
    {% endfor %}
    _QIDI_MESH_LIFT

[gcode_macro _QIDI_MESH_LIFT]
gcode:
    {% set lift = [5.0-printer.gcode_move.gcode_position.z,0.0]|max %}
    {% set z_max = [printer.toolhead.axis_maximum.z,printer['gcode_macro PRINTER_PARAM'].max_z_position]|min %}
    {% if lift > z_max-printer.toolhead.position.z %}
        {action_raise_error('Q2 mesh: insufficient Z clearance for control moves.')}
    {% endif %}
    SAFE_Z_LIFT Z={lift}

[gcode_macro _QIDI_MESH_RECORD]
gcode:
    {% set z = printer.probe.last_z_result|float %}
    {% if not (-5 < z < 5) %}
        {action_raise_error('Q2 mesh: invalid control probe result; cache remains invalid.')}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_QIDI_MESH_CACHE VARIABLE=samples VALUE="{printer['gcode_macro _QIDI_MESH_CACHE'].samples + [z]}"

[gcode_macro _QIDI_MESH_COMMIT]
gcode:
    {% set c = printer['gcode_macro _QIDI_MESH_CACHE'] %}
    {% if c.samples|length != 5 %}
        {action_raise_error('Q2 mesh: incomplete baseline measurements.')}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_QIDI_MESH_CACHE VARIABLE=baseline VALUE="{c.samples}"
    SET_GCODE_VARIABLE MACRO=_QIDI_MESH_CACHE VARIABLE=created VALUE={printer.toolhead.estimated_print_time}
    SET_GCODE_VARIABLE MACRO=_QIDI_MESH_CACHE VARIABLE=valid VALUE=1
    SET_GCODE_VARIABLE MACRO=_QIDI_MESH_CACHE VARIABLE=result VALUE="'calibrated'"
    BED_MESH_PROFILE LOAD=q2_cached
    M118 Q2 mesh: new mesh and five-point baseline ready.

[gcode_macro _QIDI_MESH_DECIDE]
gcode:
    {% set c = printer['gcode_macro _QIDI_MESH_CACHE'] %}
    {% if c.samples|length != 5 or c.baseline|length != 5 %}
        {action_raise_error('Q2 mesh: incomplete verification measurements.')}
    {% endif %}
    {% set ns = namespace(error=0.0) %}
    {% for i in range(5) %}
        {% set ns.error = [ns.error,(c.samples[i]-c.baseline[i])|abs]|max %}
    {% endfor %}
    {% set bed = printer.heater_bed %}
    {% set chamber = printer['heater_generic chamber'] %}
    {% set thermal_ok = (bed.target-c.temperatures[0])|abs <= 0.1 and (chamber.target-c.temperatures[1])|abs <= 0.1
        and (bed.temperature-c.temperatures[2])|abs <= c.bed_tolerance
        and (chamber.temperature-c.temperatures[3])|abs <= c.chamber_tolerance
        and (printer.extruder.temperature-c.temperatures[4])|abs <= c.nozzle_tolerance %}
    {% if ns.error <= c.tolerance and thermal_ok %}
        BED_MESH_PROFILE LOAD=q2_cached
        SET_GCODE_VARIABLE MACRO=_QIDI_MESH_CACHE VARIABLE=valid VALUE=1
        SET_GCODE_VARIABLE MACRO=_QIDI_MESH_CACHE VARIABLE=result VALUE="'reused'"
        SET_GCODE_VARIABLE MACRO=_QIDI_MESH_CACHE VARIABLE=reuses VALUE={c.reuses|int+1}
        M118 Q2 mesh: reused - maximum control deviation {ns.error|round(5)} mm.
    {% else %}
        M118 Q2 mesh: verification failed (maximum deviation {ns.error|round(5)} mm, thermal_ok={thermal_ok|int}) - calibrating.
        _QIDI_MESH_NEW
    {% endif %}
