# Shared geometry for SMART_PARK and LINE_PURGE. Coordinates are G-code XY.
[gcode_macro _KAMP_Purge_Path]
variable_start_x: 0.0
variable_start_y: 0.0
variable_end_x: 0.0
variable_end_y: 0.0
variable_wipe_x: 0.0
variable_wipe_y: 0.0
gcode:
    {action_respond_info('Internal KAMP path storage')}

[gcode_macro _KAMP_PREPARE_PURGE]
gcode:
    {% set settings = printer['gcode_macro _KAMP_Settings'] %}
    {% set length = settings.purge_amount|float %}
    {% set margin = [settings.purge_margin|float, 2.0]|max %}
    {% set wipe = 10.0 %}
    {% set offset_x = printer.gcode_move.position.x - printer.gcode_move.gcode_position.x %}
    {% set offset_y = printer.gcode_move.position.y - printer.gcode_move.gcode_position.y %}
    # One mm inset keeps the extrusion itself off the plate edge and cutter area.
    {% set min_x = [1.0, printer.toolhead.axis_minimum.x - offset_x + 1.0]|max %}
    {% set min_y = [1.0, printer.toolhead.axis_minimum.y - offset_y + 1.0]|max %}
    {% set max_x = [printer['gcode_macro PRINTER_PARAM'].max_x_position - 1.0, printer.toolhead.axis_maximum.x - offset_x - 1.0]|min %}
    {% set max_y = [printer['gcode_macro PRINTER_PARAM'].max_y_position - 1.0, printer.toolhead.axis_maximum.y - offset_y - 1.0]|min %}
    {% set points = printer.exclude_object.objects|map(attribute='polygon')|sum(start=[]) %}
    {% if not points %}
        {action_raise_error('KAMP: no object polygons. Enable object labels and place EXCLUDE_OBJECT_DEFINE before PRINT_START.')}
    {% endif %}
    {% if length <= 0 or settings.flow_rate|float <= 0 %}
        {action_raise_error('KAMP: purge_amount and flow_rate must be positive.')}
    {% endif %}
    {% set object_min_x = points|map(attribute=0)|min %}
    {% set object_max_x = points|map(attribute=0)|max %}
    {% set object_min_y = points|map(attribute=1)|min %}
    {% set object_max_y = points|map(attribute=1)|max %}
    {% set front_y = object_min_y - margin %}
    {% set left_x = object_min_x - margin %}
    {% if min_y <= front_y <= max_y and max_x - min_x >= length + wipe %}
        {% set start_x = [[(object_min_x + object_max_x - length) / 2, min_x]|max, max_x - length - wipe]|min %}
        {% set start_y = front_y %}
        {% set end_x = start_x + length %}
        {% set end_y = start_y %}
        {% set wipe_x = end_x + wipe %}
        {% set wipe_y = end_y %}
    {% elif min_x <= left_x <= max_x and max_y - min_y >= length + wipe %}
        {% set start_x = left_x %}
        {% set start_y = [[(object_min_y + object_max_y - length) / 2, min_y]|max, max_y - length - wipe]|min %}
        {% set end_x = start_x %}
        {% set end_y = start_y + length %}
        {% set wipe_x = end_x %}
        {% set wipe_y = end_y + wipe %}
    {% else %}
        {action_raise_error('KAMP: no safe purge line in front of or left of the objects. Move objects away from the front/left edge or adjust purge settings.')}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_KAMP_Purge_Path VARIABLE=start_x VALUE={start_x}
    SET_GCODE_VARIABLE MACRO=_KAMP_Purge_Path VARIABLE=start_y VALUE={start_y}
    SET_GCODE_VARIABLE MACRO=_KAMP_Purge_Path VARIABLE=end_x VALUE={end_x}
    SET_GCODE_VARIABLE MACRO=_KAMP_Purge_Path VARIABLE=end_y VALUE={end_y}
    SET_GCODE_VARIABLE MACRO=_KAMP_Purge_Path VARIABLE=wipe_x VALUE={wipe_x}
    SET_GCODE_VARIABLE MACRO=_KAMP_Purge_Path VARIABLE=wipe_y VALUE={wipe_y}
