[gcode_macro LINE_PURGE]
description: Purge on a validated line clear of objects and machine limits.
gcode:
    _KAMP_PREPARE_PURGE
    _PREP_MOTION_BEGIN
    _KAMP_SMART_PARK
    _KAMP_LINE_PURGE
    {% if not printer['gcode_macro _PREP_MOTION'].active|int %}
        _PREP_MOTION_END
    {% endif %}

[gcode_macro _KAMP_LINE_PURGE]
gcode:
    {% set path = printer['gcode_macro _KAMP_Purge_Path'] %}
    {% set settings = printer['gcode_macro _KAMP_Settings'] %}
    {% set height = settings.purge_height|float %}
    {% set amount = settings.purge_amount|float %}
    {% set speed = settings.flow_rate|float / 5.0 * 60 %}
    {% set travel_speed = [printer.toolhead.max_velocity|float, 150.0]|min * 60 %}
    {% set offset_z = printer.gcode_move.position.z - printer.gcode_move.gcode_position.z %}
    {% set z_max = [printer.toolhead.axis_maximum.z|float, printer['gcode_macro PRINTER_PARAM'].max_z_position|float]|min %}
    {% if height <= 0 or height + offset_z < printer.toolhead.axis_minimum.z
          or height * 2 + offset_z > z_max %}
        {action_raise_error('LINE_PURGE: invalid purge height or Z offset.')}
    {% endif %}
    {% if not printer.extruder.can_extrude %}
        {action_raise_error('LINE_PURGE: heat the nozzle before purging.')}
    {% endif %}
    {% if printer.configfile.settings.extruder.max_extrude_cross_section|float < 5 %}
        {action_raise_error('LINE_PURGE requires max_extrude_cross_section >= 5.')}
    {% endif %}
    {% if printer.firmware_retraction is defined %}
        {% set retract = 'G10' %}
        {% set unretract = 'G11' %}
    {% else %}
        {% set retract = 'G1 E-0.5 F2100' %}
        {% set unretract = 'G1 E0.5 F2100' %}
    {% endif %}

    SAVE_GCODE_STATE NAME=Prepurge_State
    G90
    M83
    G92 E0
    G0 Z{height} F600
    {% if printer.firmware_retraction is defined %}
        G11
    {% endif %}
    G1 E{settings.tip_distance|float} F{speed}
    G1 X{path.end_x} Y{path.end_y} E{amount} F{speed}
    {retract}
    G0 X{path.wipe_x} Y{path.wipe_y} F{travel_speed}
    SAFE_Z_LIFT Z={height}
    {unretract}
    G92 E0
    RESTORE_GCODE_STATE NAME=Prepurge_State
