# Безопасный подъём Z на заданное расстояние (по умолчанию 50 мм).
# Если Z не был homed, перемещение пропускается: движение к абсолютному максимуму
# без известной координаты не является безопасным.
[gcode_macro SAFE_Z_LIFT]
description: Lift within physical Z travel; never lower or move an unhomed Z.
gcode:
    {% set lift = [params.Z|default(50)|float, 0.0]|max %}
    {% if 'z' in printer.toolhead.homed_axes %}
        {% set z_max = [printer.toolhead.axis_maximum.z|float, printer['gcode_macro PRINTER_PARAM'].max_z_position|float]|min %}
        {% set available = [z_max - printer.toolhead.position.z|float, 0.0]|max %}
        {% set distance = [lift, available]|min %}
        {% if distance > 0 %}
            SAVE_GCODE_STATE NAME=SafeZLift_State
            G91
            G1 Z{distance} F600
            RESTORE_GCODE_STATE NAME=SafeZLift_State
        {% endif %}
    {% else %}
        M118 SAFE_Z_LIFT skipped: Z axis is not homed
    {% endif %}

[gcode_macro ENABLE_BOX_BUFFER]
gcode:
    {% set has_box = printer.save_variables.variables.box_count|default(0)|int >= 1
                     and printer["box_extras"] is defined
                     and printer.save_variables.variables.enable_box|default(0)|int == 1 %}

    {% if has_box %}
        BUFFER_MONITORING ENABLE=1
    {% endif %}
